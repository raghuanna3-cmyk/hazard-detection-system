<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Safety Prediction</title>
</head>
<body>
    <h1>Welcome to the AI Safety Prediction System!</h1>
    
    <!-- Form to submit data -->
    <form method="POST">
        <label for="Temperature">Temperature:</label>
        <input type="text" name="Temperature" required><br><br>
        
        <label for="Heart_Rate">Heart Rate:</label>
        <input type="text" name="Heart_Rate" required><br><br>
        
        <label for="Gas_Level">Gas Level:</label>
        <input type="text" name="Gas_Level" required><br><br>
        
        <label for="Motion">Motion:</label>
        <input type="text" name="Motion" required><br><br>
        
        <button type="submit">Get Prediction</button>
    </form>

    {% if escape_route %}
        <h2>Status: {{ status }}</h2>
        <h3>Escape Route: {{ escape_route }}</h3>
    {% endif %}
</body>
</html>
